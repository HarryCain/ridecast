[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ridecast"
version = "0.1.0"
description = "Auditable one-hour-ahead bike demand forecasting and backtesting."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "streamlit>=1.66,<2", "plotly>=6,<8", "certifi>=2025",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ridecast = "ridecast.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
